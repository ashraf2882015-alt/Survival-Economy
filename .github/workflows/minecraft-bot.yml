name: Minecraft Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'bot/**'
      - '.github/workflows/minecraft-bot.yml'

# Only one bot session should exist at a time.
# The current run triggers its replacement before the runner expires, then exits.
concurrency:
  group: minecraft-bot
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    defaults:
      run:
        working-directory: bot

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bot/package.json

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Bot With Auto-Recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u

          npm start &
          BOT_PID=$!

          # Keep the runner busy while the bot is alive.
          # Restart the workflow before the GitHub-hosted runner time limit.
          MAX_SECONDS=20100
          CHECK_INTERVAL=10
          ELAPSED=0

          while kill -0 "$BOT_PID" 2>/dev/null; do
            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "Runner refresh time reached. Starting the next workflow..."

              gh workflow run minecraft-bot.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref "$GITHUB_REF_NAME"

              echo "Next workflow requested successfully. Stopping current bot session."
              kill "$BOT_PID" 2>/dev/null || true
              wait "$BOT_PID" 2>/dev/null || true
              exit 0
            fi

            sleep "$CHECK_INTERVAL"
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done

          wait "$BOT_PID"

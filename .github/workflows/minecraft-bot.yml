name: Minecraft Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'bot/**'
      - '.github/workflows/minecraft-bot.yml'
  schedule:
    - cron: '0 */4 * * *'

# Never allow a scheduled/manual run to kill a healthy bot session.
# A new scheduled run will wait for the current one to finish.
concurrency:
  group: minecraft-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    defaults:
      run:
        working-directory: bot

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bot/package.json

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Minecraft Bot
        run: npm start

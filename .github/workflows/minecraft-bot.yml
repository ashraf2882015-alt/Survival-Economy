name: Minecraft Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'bot/**'
      - '.github/workflows/minecraft-bot.yml'

# A replacement run intentionally cancels the old run after the new run is queued.
# This avoids a growing queue while keeping only one bot session alive.
concurrency:
  group: minecraft-bot
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    defaults:
      run:
        working-directory: bot

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bot/package.json

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Bot With Recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u

          START_TIME=$(date +%s)
          REFRESH_AFTER=19800
          RESTART_DELAY=5

          start_bot() {
            echo "🚀 Starting Minecraft bot..."
            npm start &
            BOT_PID=$!
            echo "Bot PID: $BOT_PID"
          }

          start_bot

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            # If the bot process exits unexpectedly, restart it in the same runner.
            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "⚠️ Bot process stopped. Restarting in ${RESTART_DELAY}s..."
              wait "$BOT_PID" 2>/dev/null || true
              sleep "$RESTART_DELAY"
              start_bot
              continue
            fi

            # Start a replacement workflow before the runner's hard time limit.
            # The new run cancels this run because of the concurrency policy above.
            if [ "$ELAPSED" -ge "$REFRESH_AFTER" ]; then
              echo "♻️ Refreshing GitHub runner..."

              if gh workflow run minecraft-bot.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref "$GITHUB_REF_NAME"; then
                echo "✅ Replacement workflow queued. Shutting down this bot session."
                kill "$BOT_PID" 2>/dev/null || true
                wait "$BOT_PID" 2>/dev/null || true
                exit 0
              else
                echo "⚠️ Could not queue replacement workflow; keeping current bot alive."
                sleep 30
              fi
            fi

            sleep 10
          done

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survival Economy Control</title><style>body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui;padding:24px}main{max-width:900px;margin:auto}.card{background:#121a2d;border:1px solid #26324c;border-radius:18px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{background:#0d1425;border-radius:12px;padding:14px}.muted{color:#9aa7c2}button,input{padding:12px;border-radius:10px;border:1px solid #33415f;background:#18233a;color:white}button{cursor:pointer;font-weight:700;margin:4px}.row{display:flex;gap:8px;flex-wrap:wrap}.online{color:#4ade80}.off{color:#f87171}</style></head><body><main><h1>🤖 Survival Economy</h1><p class="muted">Minecraft Bot Control</p><section class="card"><label>API URL</label><div class="row"><input id="api" style="flex:1" placeholder="https://your-api.example.com"><button onclick="saveApi()">Save</button></div><p class="muted">For GitHub Pages, enter the public URL of the API server running with the bot.</p></section><section class="card"><h2>Status: <span id="state">OFFLINE</span></h2><div class="grid"><div class="stat">Username<br><b id="name">—</b></div><div class="stat">Server<br><b id="server">—</b></div><div class="stat">Health<br><b id="health">—</b></div><div class="stat">Food<br><b id="food">—</b></div><div class="stat">Position<br><b id="pos">—</b></div></div><div class="row" style="margin-top:14px"><button onclick="act('start')">▶ Start</button><button onclick="act('stop')">■ Stop</button><button onclick="act('reconnect')">↻ Reconnect</button><button onclick="status()">⟳ Refresh</button></div></section><section class="card"><h2>Chat</h2><div class="row"><input id="msg" style="flex:1" placeholder="Message"><button onclick="chat()">Send</button></div><p id="result" class="muted"></p></section></main><script>let base=localStorage.getItem('botApi')||'';document.getElementById('api').value=base;function saveApi(){base=document.getElementById('api').value.trim().replace(/\/$/,'');localStorage.setItem('botApi',base);status()}async function call(path,opt){if(!base)throw Error('Set API URL first');let r=await fetch(base+path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'API error');return d}async function status(){try{let s=await call('/api/status');let on=s.online;document.getElementById('state').textContent=on?'ONLINE':s.connecting?'CONNECTING':'OFFLINE';document.getElementById('state').className=on?'online':'off';document.getElementById('name').textContent=s.username||'—';document.getElementById('server').textContent=s.server||'—';document.getElementById('health').textContent=s.health==null?'—':Number(s.health).toFixed(1);document.getElementById('food').textContent=s.food==null?'—':s.food;document.getElementById('pos').textContent=s.position?`${s.position.x}, ${s.position.y}, ${s.position.z}`:'—'}catch(e){document.getElementById('result').textContent=e.message}}async function act(action){try{await call('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});document.getElementById('result').textContent=action+' sent';setTimeout(status,500)}catch(e){document.getElementById('result').textContent=e.message}}async function chat(){let message=document.getElementById('msg').value.trim();if(!message)return;try{await call('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'chat',message})});document.getElementById('msg').value='';document.getElementById('result').textContent='Message sent'}catch(e){document.getElementById('result').textContent=e.message}}status();setInterval(status,3000)</script></body></html>

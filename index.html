<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survival Economy Bot</title>
<style>
body{font-family:system-ui;background:#101318;color:#eee;max-width:900px;margin:30px auto;padding:0 16px}.card{background:#181d24;border:1px solid #2b333d;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{padding:14px;background:#11151b;border-radius:10px}.ok{color:#63e6be}.bad{color:#ff8787}.warn{color:#ffd43b}button,input{padding:11px;border-radius:9px;border:1px solid #39424d;background:#11151b;color:#fff}button{cursor:pointer}button:hover{background:#222a34}.row{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:180px}small{color:#9aa4af}.hidden{display:none}.error{color:#ff8787;margin-top:10px}.hint{color:#9aa4af;line-height:1.5}
</style>
</head>
<body>
<h1>🤖 Survival Economy Bot</h1>

<div class="card">
  <h3>🔌 API Connection</h3>
  <div class="row">
    <input id="apiUrl" placeholder="https://your-api.example.com" autocomplete="off">
    <button onclick="saveApi()">Save</button>
    <button onclick="testApi()">Test</button>
  </div>
  <div id="apiMessage" class="hint">GitHub Pages can only host this interface. Enter the public HTTPS URL of the bot API.</div>
</div>

<div class="card"><div class="grid">
<div class="stat">Status<br><b id="status">Not connected</b></div>
<div class="stat">Health<br><b id="health">-</b></div>
<div class="stat">Food<br><b id="food">-</b></div>
<div class="stat">Uptime<br><b id="uptime">-</b></div>
</div></div>

<div class="card"><h3>Control</h3><div class="row">
<button onclick="control('start')">▶ Start</button>
<button onclick="control('stop')">⏹ Stop</button>
<button onclick="control('reconnect')">🔄 Reconnect</button>
</div></div>

<div class="card"><h3>Chat</h3><div class="row">
<input id="msg" maxlength="200" placeholder="Message to Minecraft..." onkeydown="if(event.key==='Enter')sendChat()">
<button onclick="sendChat()">Send</button>
</div></div>

<div class="card"><h3>Server</h3><small id="server">-</small><br><small id="position">Position: -</small></div>

<script>
const $=id=>document.getElementById(id);
const saved=localStorage.getItem('survivalEconomyApi')||'';
$('apiUrl').value=saved;

function baseUrl(){return $('apiUrl').value.trim().replace(/\/$/,'')}
function saveApi(){
  const url=baseUrl();
  if(url&&!/^https:\/\//i.test(url)){
    $('apiMessage').textContent='⚠️ Use an HTTPS URL for the public API.';
    $('apiMessage').className='error';
    return;
  }
  localStorage.setItem('survivalEconomyApi',url);
  $('apiMessage').textContent=url?'✅ API URL saved.':'⚠️ No API URL set.';
  $('apiMessage').className=url?'hint':'error';
  refresh();
}

async function api(path,options={}){
  const base=baseUrl();
  if(!base) throw Error('Set the API URL first.');
  const r=await fetch(base+path,{...options,mode:'cors'});
  const text=await r.text();
  let data;
  try{data=JSON.parse(text)}catch(_){throw Error('API returned HTML instead of JSON. Check the API URL.')} 
  if(!r.ok)throw Error(data.error||'Request failed');
  return data;
}

async function testApi(){
  $('apiMessage').textContent='Testing...';
  try{await api('/api/status');$('apiMessage').textContent='✅ API connected successfully.';$('apiMessage').className='hint';refresh()}
  catch(e){$('apiMessage').textContent='❌ '+e.message;$('apiMessage').className='error'}
}

async function refresh(){
  if(!baseUrl()){ $('status').textContent='⚠️ API not configured'; $('status').className='warn'; return; }
  try{
    const d=await api('/api/status');
    $('status').textContent=d.online?'🟢 Online':'🔴 Offline';
    $('status').className=d.online?'ok':'bad';
    $('health').textContent=d.health??'-';
    $('food').textContent=d.food??'-';
    $('uptime').textContent=format(d.uptime);
    $('server').textContent=`${d.username||'Bot'} @ ${d.host||'-'}:${d.port||'-'}`;
    $('position').textContent=d.position?`Position: ${d.position.x}, ${d.position.y}, ${d.position.z}`:'Position: -';
  }catch(e){
    $('status').textContent='⚠️ API not connected';
    $('status').className='warn';
  }
}

function format(s){s=Math.max(0,Number(s)||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return `${h}h ${m}m ${x}s`}

async function control(action){
  try{await api('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});await refresh()}
  catch(e){alert(e.message)}
}

async function sendChat(){
  const i=$('msg');
  const message=i.value.trim();
  if(!message)return;
  try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});i.value=''}
  catch(e){alert(e.message)}
}

refresh();
setInterval(refresh,5000);
</script>
</body>
</html>
